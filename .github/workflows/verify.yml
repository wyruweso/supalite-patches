name: verify

on:
   push:
   pull_request:

jobs:
   verify:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-node@v4
           with:
              node-version: 24
              cache: npm
         - run: npm ci
         - run: npm run verify
         # Reproductions are demonstrations; verify above checks their behavior.
         - run: npm run repro
